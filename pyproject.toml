[project]
name = "agentguard"
version = "0.1.0"
description = "Automated red-teaming for AI agent applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "click>=8.1",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "google-adk",
    "litellm",
    "chromadb",
    "crewai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*is deprecated.*",
]
